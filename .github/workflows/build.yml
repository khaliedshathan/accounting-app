name: Build Flutter APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Build Flutter App Directly
      run: |
        # إنشاء مشروع فلاتر متكامل وشامل لكل ملفات أندرويد
        flutter create --project-name accounting_app --org com.example.accounting my_app
        
        # نسخ كود تطبيقك إلى المشروع
        if [ -f main.dart ]; then
          cp main.dart my_app/lib/main.dart
        fi
        
        # الانتقال لداخل المشروع وبناء APK
        cd my_app
        flutter pub get
        flutter build apk --release

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Flutter-AccountingApp-APK
        path: my_app/build/app/outputs/flutter-apk/app-release.apk
