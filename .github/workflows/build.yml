name: Build Flutter APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Build Debug APK
      run: |
        flutter create --project-name my_accounting_app --org com.mycompany.accounting my_app
        if [ -f main.dart ]; then
          cp main.dart my_app/lib/main.dart
        fi
        cd my_app
        flutter pub get
        flutter build apk --debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AccountingApp-Debug-APK
        path: my_app/build/app/outputs/flutter-apk/app-debug.apk
