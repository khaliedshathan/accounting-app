name: Build Accounting App APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify project files
        run: |
          test -f pubspec.yaml
          test -f lib/main.dart

      - name: Generate Android project
        run: |
          if [ ! -f android/gradlew ]; then
            flutter create --platforms=android --org com.accountingapp --project-name accounting_app .
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Check Dart code
        run: flutter analyze --no-pub

      - name: Build APK
        run: flutter build apk --debug --no-pub

      - name: Verify APK
        run: |
          test -f build/app/outputs/flutter-apk/app-debug.apk
          ls -lh build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AccountingApp-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
