name: Build Flutter APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Create Flutter Project Skeleton & Fix Paths
      run: |
        flutter create --project-name accounting_app --org com.example.accounting temp_app
        mkdir -p lib
        if [ -f main.dart ]; then
          cp main.dart lib/main.dart
        fi
        cp temp_app/android -r ./ 2>/dev/null || true
        cp temp_app/ios -r ./ 2>/dev/null || true
        rm -rf temp_app

    - name: Get Flutter Packages
      run: flutter pub get

    - name: Build Release APK
      run: flutter build apk --release

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Flutter-AccountingApp-APK
        path: build/app/outputs/flutter-apk/app-release.apk
