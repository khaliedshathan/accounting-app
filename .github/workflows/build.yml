name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies & Android SDK Tools
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libffi-dev libssl-dev cmake build-essential
        pip install --upgrade pip
        pip install buildozer cython

    - name: Create and Configure Spec File
      run: |
        buildozer init
        # إعداد بيانات التطبيق
        sed -i 's/title = My Application/title = AccountingApp/' buildozer.spec
        sed -i 's/package.name = myapp/package.name = accountingapp/' buildozer.spec
        sed -i 's/package.domain = org.test/package.domain = org.khalied/' buildozer.spec
        sed -i 's/source.include_exts = py,png,jpg,kv,atlas/source.include_exts = py,html,css,json/' buildozer.spec
        sed -i 's/requirements = python3,kivy/requirements = python3,flask/' buildozer.spec
        sed -i 's/# android.permissions = INTERNET/android.permissions = INTERNET/' buildozer.spec
        # إعدادات التراخيص والإصدارات المحددة لتجنب خطأ AIDL
        sed -i 's/# android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec
        sed -i 's/# android.api = 31/android.api = 33/' buildozer.spec
        sed -i 's/# android.minapi = 21/android.minapi = 21/' buildozer.spec
        sed -i 's/# android.ndk = 25b/android.ndk = 25b/' buildozer.spec

    - name: Build APK with Buildozer
      run: |
        # الإجابة بـ yes تلقائياً لتوافق شروط تراخيص جوجل وتنزيل build-tools و AIDL
        yes | buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AccountingApp-APK
        path: bin/*.apk
